name: Tests

on:
  # Woechentlicher Lauf: requirements.txt ist nicht gepinnt (>=), CI und Streamlit Cloud installieren also immer
  # die neuesten Versionen. So faellt ein Bruch durch ein Streamlit-/Plotly-Update auf, bevor der naechste Push
  # oder Neustart der Demo ihn sichtbar macht. Rote Laeufe meldet demo-health.yml der Website taeglich.
  schedule:
    - cron: "20 4 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Eine ALNS-Iteration kostet ungleich mehr Rechenzeit als ein einzelner Nachbarschafts-Kandidat (siehe
    # alns_algorithm.py) - diese Testsuite laeuft deutlich laenger als bei jedem anderen Stueck dieser Linie
    # (lokal ~38 Minuten), deshalb ein grosszuegigeres Timeout als der Standard-Fallback (360 Minuten) noetig waere.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausführen
        run: python -m pytest tests/ -v --durations=10
